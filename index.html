<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Thème choisi précédemment, sinon celui de l'appareil
    (function () {
      var t = null;
      try { t = localStorage.getItem("imposteur-lol-theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>Imposteur LoL</title>
  <style>
    :root {
      --line: #2b2d42; --text: #2b2d42; --card: #fff;
      --paper: #ffe3f0; --bg: #ffb3d9; --dots: #ff8fc7;
    }
    /* Thème sombre : violets profonds, plus doux pour les yeux le soir */
    [data-theme="dark"] {
      --line: #0d0b1a; --text: #f3ecff; --card: #2b2745;
      --paper: #383359; --bg: #1d1a2f; --dots: #2a2644;
    }
    [hidden] { display: none !important; }

    /* Fond façon plateau de jeu : crème avec petits points */
    body {
      margin: 0; padding: 28px 16px 48px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--text); background-color: var(--bg);
      background-image: radial-gradient(var(--dots) 2px, transparent 2px);
      background-size: 26px 26px;
    }
    h1 {
      margin: 0; text-align: center; font-size: clamp(2.2rem, 6vw, 3.4rem);
      color: #fff; text-shadow: 3px 3px 0 var(--line); letter-spacing: 1px;
    }
    h2 { margin: 0 0 14px; font-size: 1.6rem; }
    h3 { margin: 20px 0 10px; font-size: 1.2rem; }

    /* Chaque écran est une "carte" avec contour épais et ombre décalée */
    #home, #lobby, #game, #voting, #finished {
      box-sizing: border-box; width: 100%; max-width: 560px;
      padding: 24px; background: var(--card);
      border: 3px solid var(--line); border-radius: 20px; box-shadow: 7px 7px 0 var(--line);
    }
    #home { display: flex; flex-direction: column; gap: 12px; }
    #home br, #lobby br { display: none; }

    /* Code du salon : une pastille bien visible */
    #codeBanner {
      margin: 0; padding: 8px 18px; font-weight: 700; color: #2b2d42;
      background: #ffd166; border: 3px solid var(--line); border-radius: 999px;
      box-shadow: 3px 3px 0 var(--line);
    }
    #bannerCode, #roomCode { font-size: 1.3em; letter-spacing: .25em; }
    #roomCode { color: #ef476f; }

    /* Champs de saisie */
    input {
      box-sizing: border-box; width: 100%; font: inherit; font-size: 1.1rem;
      padding: 12px 14px; border: 3px solid var(--line); border-radius: 14px;
      background: var(--card); color: var(--text);
    }
    input:focus { outline: 3px solid #4cc9f0; }
    #code { text-align: center; text-transform: uppercase; letter-spacing: .3em; font-weight: 700; }
    #message { margin: 0; min-height: 1.2em; color: #d62839; font-weight: 700; }

    /* Boutons : gros, arrondis, avec un effet d'enfoncement */
    button {
      font: inherit; font-weight: 700; font-size: 1.05rem; min-height: 48px;
      padding: 10px 22px; margin-bottom: 6px; cursor: pointer;
      color: var(--text); background: var(--card);
      border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 5px 0 var(--line);
      transition: transform .08s, box-shadow .08s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #create, #again { background: #ffd166; }
    #join, #toggleRole { background: #4cc9f0; }
    #start, #win { background: #06d6a0; }
    #loss, #closeRoom { background: #ff5d73; color: #fff; }
    #create, #again, #join, #toggleRole, #start, #win { color: #2b2d42; }

    /* Liste des joueurs : une pastille de couleur par joueur, façon équipage */
    #players, #voteResult, #ranking { list-style: none; margin: 0 0 14px; padding: 0; }
    #players li {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
      padding: 10px 14px; font-weight: 700; font-size: 1.1rem;
      background: var(--paper); border: 3px solid var(--line); border-radius: 14px;
    }
    #players li::before {
      content: ""; flex: none; width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid var(--line); background: #ef476f;
    }
    #players li:nth-child(5n+2)::before { background: #ffd166; }
    #players li:nth-child(5n+3)::before { background: #06d6a0; }
    #players li:nth-child(5n+4)::before { background: #4cc9f0; }
    #players li:nth-child(5n+5)::before { background: #b185db; }
    #players li button {
      margin: 0 0 0 auto; min-height: 36px; padding: 4px 14px; font-size: .9rem;
      background: #ff5d73; color: #fff; box-shadow: 0 3px 0 var(--line);
    }
    #count { margin: 0 0 16px; font-weight: 700; opacity: .7; }

    /* Écran de jeu */
    #role {
      margin: 16px 0; padding: 20px; text-align: center; font-size: 1.3rem; font-weight: 700;
      border: 3px solid var(--line); border-radius: 16px;
    }
    #role.impostor { background: #ff5d73; color: #fff; }
    #role.crew { background: #4cc9f0; color: #2b2d42; }
    #hostButtons {
      display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; padding-top: 18px;
      border-top: 3px dashed var(--line);
    }
    #hostButtons p { width: 100%; margin: 0; font-weight: 700; }

    /* Vote : de grosses cases à toucher */
    #voteStatus { font-size: 1.2rem; font-weight: 700; margin-top: 0; }
    #voteList { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    #voteList button { background: #b185db; color: #fff; min-height: 60px; font-size: 1.15rem; }

    /* Résultat */
    #resultText { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
    #voteResult li, #ranking li {
      margin-bottom: 8px; padding: 8px 14px; font-weight: 700;
      background: var(--paper); border: 2px solid var(--line); border-radius: 12px;
    }

    [data-theme="dark"] h1 { color: #ff9fd0; }
    [data-theme="dark"] #message { color: #ff8099; }
    [data-theme="dark"] #hostButtons { border-top-color: #5b5585; }

    /* Bouton de bascule clair / sombre, toujours accessible en haut à droite */
    #themeToggle {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      width: 48px; padding: 0; margin: 0; font-size: 1.4rem; border-radius: 50%;
    }

    /* Sur téléphone : cartes plus compactes, boutons pleine largeur */
    @media (max-width: 600px) {
      body { padding: 18px 10px 36px; }
      #home, #lobby, #game, #voting, #finished { padding: 18px; box-shadow: 5px 5px 0 var(--line); }
      #home button, #lobby > button, #game > button, #finished button, #hostButtons button { width: 100%; }
    }
  </style>
</head>
<body>
  <button id="themeToggle" aria-label="Changer de thème"></button>
  <h1>Imposteur LoL</h1>
  <p id="codeBanner" hidden>Code du salon : <strong id="bannerCode"></strong></p>

  <!-- Écran 1 : accueil -->
  <div id="home">
    <input id="pseudo" placeholder="Pseudo">
    <button id="create">Créer un salon</button>
    <br><br>
    <input id="code" placeholder="Code du salon" maxlength="4">
    <button id="join">Rejoindre</button>
    <p id="message"></p>
  </div>

  <!-- Écran 2 : salle d'attente -->
  <div id="lobby" hidden>
    <h2>Salon <span id="roomCode"></span></h2>
    <ul id="players"></ul>
    <p id="count"></p>
    <button id="start" hidden>Lancer la partie</button>
    <br><br>
    <button id="leave">Quitter le salon</button>
    <button id="closeRoom" hidden>Fermer le salon</button>
  </div>

  <!-- Écran 3 : partie en cours -->
  <div id="game" hidden>
    <h2>Partie en cours</h2>
    <button id="toggleRole">Voir mon rôle</button>
    <p id="role" hidden></p>
    <div id="hostButtons" hidden>
      <p>Résultat de la partie de League of Legends :</p>
      <button id="win">Victoire</button>
      <button id="loss">Défaite</button>
    </div>
  </div>

  <!-- Écran 4 : vote -->
  <div id="voting" hidden>
    <h2>Vote</h2>
    <p id="voteStatus"></p>
    <div id="voteList"></div>
  </div>

  <!-- Écran 5 : résultat -->
  <div id="finished" hidden>
    <h2>Fin de partie</h2>
    <p id="resultText"></p>
    <ul id="voteResult"></ul>
    <h3>Classement du salon</h3>
    <ul id="ranking"></ul>
    <button id="again" hidden>Nouvelle partie</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // À remplacer par vos propres informations
    const SUPABASE_URL = "https://oazlcjvblrgqllywyrsa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Z07-Kw4YAAKII4b7nWKoJw_GLgCKlgm";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let roomCode = null;
    let myId = null;
    let myRole = null; // true = imposteur, false = équipier
    let channel = null; // le canal temps réel du salon courant

    const $ = (id) => document.getElementById(id);
    const SCREENS = ["home", "lobby", "game", "voting", "finished"];
    const SESSION_KEY = "imposteur-lol-session";

    function say(text) { $("message").textContent = text; }

    function show(screen) {
      for (const s of SCREENS) $(s).hidden = (s !== screen);

      // Le code du salon reste visible pendant toute la partie
      // (inutile à l'accueil, et déjà affiché dans le titre de la salle d'attente)
      $("codeBanner").hidden = (screen === "home" || screen === "lobby");
      $("bannerCode").textContent = roomCode || "";
    }

    function randomCode() {
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
      let c = "";
      for (let i = 0; i < 4; i++) c += letters[Math.floor(Math.random() * letters.length)];
      return c;
    }

    async function addPlayer(code, pseudo) {
      const { data, error } = await db
        .from("players")
        .insert({ room_code: code, pseudo })
        .select()
        .single();
      if (error) { console.error(error); say("Impossible de rejoindre le salon."); return null; }
      return data;
    }

    // ---------- Accueil ----------

    $("create").addEventListener("click", async () => {
      const pseudo = $("pseudo").value.trim();
      if (!pseudo) return say("Entrez un pseudo.");

      let code, error;
      for (let i = 0; i < 5; i++) {
        code = randomCode();
        ({ error } = await db.from("rooms").insert({ code }));
        if (!error) break;
      }
      if (error) { console.error(error); return say("Impossible de créer le salon."); }

      const player = await addPlayer(code, pseudo);
      if (!player) return;

      await db.from("rooms").update({ host_id: player.id }).eq("code", code);
      enterRoom(code, player.id);
    });

    $("join").addEventListener("click", async () => {
      const pseudo = $("pseudo").value.trim();
      const code = $("code").value.trim().toUpperCase();
      if (!pseudo) return say("Entrez un pseudo.");
      if (!code) return say("Entrez un code de salon.");

      const { data: room } = await db.from("rooms").select("*").eq("code", code).maybeSingle();
      if (!room) return say("Salon introuvable.");

      const { data } = await db.from("players").select("id, pseudo").eq("room_code", code);
      const existing = data || [];

      // Même pseudo qu'un joueur du salon : on reprend sa place (à tout moment)
      const same = existing.find((p) => p.pseudo.toLowerCase() === pseudo.toLowerCase());
      if (same) return enterRoom(code, same.id);

      // Sinon, c'est un nouveau joueur : possible seulement en salle d'attente
      if (room.status !== "lobby") {
        return say("La partie a déjà commencé : seuls les joueurs déjà présents peuvent revenir, avec leur pseudo.");
      }
      if (existing.length >= room.max_players) return say("Salon complet.");

      const player = await addPlayer(code, pseudo);
      if (!player) return;
      enterRoom(code, player.id);
    });

    // ---------- Temps réel ----------

    function enterRoom(code, playerId) {
      roomCode = code;
      myId = playerId;

      // On retient où l'on est, pour pouvoir revenir après un rechargement de page
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ roomCode: code, playerId }));
      } catch (e) { console.error(e); }

      // On écoute les trois tables : joueurs, salon et votes
      channel = db.channel("room-" + code)
        .on("postgres_changes",
            { event: "*", schema: "public", table: "players", filter: `room_code=eq.${code}` },
            refresh)
        .on("postgres_changes",
            { event: "*", schema: "public", table: "rooms", filter: `code=eq.${code}` },
            refresh)
        .on("postgres_changes",
            { event: "*", schema: "public", table: "votes", filter: `room_code=eq.${code}` },
            refresh)
        // Les suppressions ne peuvent pas être filtrées : on les écoute toutes,
        // et refresh() relit simplement l'état de notre salon
        .on("postgres_changes",
            { event: "DELETE", schema: "public", table: "players" },
            refresh)
        .on("postgres_changes",
            { event: "DELETE", schema: "public", table: "rooms" },
            refresh)
        .subscribe();

      refresh();
    }

    // Relit tout et choisit l'écran selon le statut du salon
    async function refresh() {
      if (!roomCode) return; // pas de salon courant : rien à afficher
      const { data: room, error: roomError } = await db
        .from("rooms")
        .select("*")
        .eq("code", roomCode)
        .maybeSingle();
      if (roomError) { console.error(roomError); return; }
      if (!room) return leaveLocally("Le salon a été fermé.");
      const { data: players } = await db
        .from("players")
        .select("id, pseudo, is_impostor, score")
        .eq("room_code", roomCode);
      const { data: votes } = await db
        .from("votes")
        .select("voter_id, target_id")
        .eq("room_code", roomCode);
      if (!players || !votes) return;

      // Si l'on n'est plus dans la liste des joueurs, on a été retiré du salon
      if (!players.some((p) => p.id === myId)) {
        return leaveLocally("Vous avez été retiré du salon.");
      }

      players.sort((a, b) => a.pseudo.localeCompare(b.pseudo));
      const isHost = (myId === room.host_id);

      if (room.status === "lobby") {
        // Nouvelle partie : on oublie le rôle précédent et on le recache
        myRole = null;
        $("role").hidden = true;
        $("toggleRole").textContent = "Voir mon rôle";

        show("lobby");
        $("roomCode").textContent = roomCode;
        $("players").innerHTML = "";
        for (const p of players) {
          const li = document.createElement("li");
          let label = p.pseudo;
          if (p.id === room.host_id) label += " (hôte)";
          if (p.id === myId) label += " (vous)";
        if (p.score > 0) label += ` · ${p.score} pt(s)`;
          li.textContent = label;
          // L'hôte peut retirer un autre joueur (salle d'attente uniquement)
          if (isHost && p.id !== myId) {
            const kick = document.createElement("button");
            kick.textContent = "Retirer";
            kick.addEventListener("click", () => kickPlayer(p.id));
            li.append(" ", kick);
          }
          $("players").appendChild(li);
        }
        $("count").textContent = `${players.length} / ${room.max_players} joueurs`;
        $("start").hidden = !isHost;
        $("leave").hidden = isHost;
        $("closeRoom").hidden = !isHost;
        $("start").disabled = (players.length !== room.max_players);
        return;
      }

      if (room.status === "playing") {
        const me = players.find((p) => p.id === myId);
        myRole = me ? me.is_impostor : null;
        $("hostButtons").hidden = !isHost;
        show("game");
        return;
      }

      if (room.status === "voting") {
        // L'hôte clôt le vote quand tout le monde a voté
        if (isHost && votes.length === players.length) {
          const { data: done } = await db
            .from("rooms")
            .update({ status: "finished" })
            .eq("code", roomCode)
            .eq("status", "voting")
            .select();
          if (done && done.length) await awardPoints("loss");
        }

        const hasVoted = votes.some((v) => v.voter_id === myId);
        $("voteList").innerHTML = "";
        if (hasVoted) {
          $("voteStatus").textContent =
            `Vote enregistré. En attente des autres (${votes.length} / ${players.length}).`;
        } else {
          $("voteStatus").textContent = "Qui est l'imposteur ?";
          for (const p of players) {
            if (p.id === myId) continue; // on ne vote pas pour soi
            const b = document.createElement("button");
            b.textContent = p.pseudo;
            b.addEventListener("click", () => vote(p.id));
            $("voteList").appendChild(b);
          }
        }
        show("voting");
        return;
      }

      if (room.status === "finished") {
        const impostor = players.find((p) => p.is_impostor);
        const name = impostor ? impostor.pseudo : "?";

        const { counts, caught, gains } = computePoints(room.result, players, votes);

        if (room.result === "win") {
          $("resultText").textContent =
            `Victoire de l'équipe ! L'imposteur était ${name} : il perd.`;
          $("voteResult").innerHTML = "";
        } else {
          // (la règle « strictement plus de voix » est dans computePoints)
          $("resultText").textContent = caught
            ? `Défaite, mais ${name} était l'imposteur et il a été démasqué : il perd aussi !`
            : `Défaite. ${name} était l'imposteur et il n'a pas été démasqué : l'imposteur gagne.`;

          $("voteResult").innerHTML = "";
          for (const p of players) {
            const li = document.createElement("li");
            li.textContent = `${p.pseudo} : ${counts[p.id] || 0} vote(s)`;
            $("voteResult").appendChild(li);
          }
        }
        // Classement cumulé du salon, avec les points gagnés pendant cette partie
        const ranking = [...players].sort(
          (a, b) => b.score - a.score || a.pseudo.localeCompare(b.pseudo)
        );
        $("ranking").innerHTML = "";
        ranking.forEach((p, i) => {
          const li = document.createElement("li");
          const gain = gains[p.id] ? ` (+${gains[p.id]})` : "";
          li.textContent = `${i + 1}. ${p.pseudo} : ${p.score} pt(s)${gain}`;
          $("ranking").appendChild(li);
        });

        $("again").hidden = !isHost;
        show("finished");
      }
    }

    // ---------- Actions ----------

    // Lancer la partie : tirage de l'imposteur, puis changement de statut
    $("start").addEventListener("click", async () => {
      const { data: players } = await db.from("players").select("id").eq("room_code", roomCode);
      const impostor = players[Math.floor(Math.random() * players.length)];
      await db.from("players").update({ is_impostor: true }).eq("id", impostor.id);
      await db.from("rooms").update({ status: "playing" }).eq("code", roomCode);
    });

    // Voir ou cacher son rôle
    $("toggleRole").addEventListener("click", () => {
      const roleEl = $("role");
      if (!roleEl.hidden) {
        roleEl.hidden = true;
        $("toggleRole").textContent = "Voir mon rôle";
      } else {
        roleEl.textContent = myRole
          ? "Vous êtes l'IMPOSTEUR : faites perdre l'équipe sans vous faire repérer."
          : "Vous êtes un ÉQUIPIER : gagnez la partie et démasquez l'imposteur.";
        roleEl.className = myRole ? "impostor" : "crew";
        roleEl.hidden = false;
        $("toggleRole").textContent = "Cacher mon rôle";
      }
    });

    // L'hôte indique le résultat de la partie
    $("win").addEventListener("click", async () => {
      const { data: done } = await db
        .from("rooms")
        .update({ status: "finished", result: "win" })
        .eq("code", roomCode)
        .eq("status", "playing")
        .select();
      if (done && done.length) await awardPoints("win");
    });
    $("loss").addEventListener("click", async () => {
      await db.from("rooms").update({ status: "voting", result: "loss" }).eq("code", roomCode);
    });

    // Un joueur vote (la table interdit un second vote du même joueur)
    async function vote(targetId) {
      const { error } = await db
        .from("votes")
        .insert({ room_code: roomCode, voter_id: myId, target_id: targetId });
      if (error) console.error(error);
    }

    // Nouvelle partie : on efface votes, rôles et résultat, et on revient au salon
    $("again").addEventListener("click", async () => {
      await db.from("votes").delete().eq("room_code", roomCode);
      await db.from("players").update({ is_impostor: false }).eq("room_code", roomCode);
      await db.from("rooms").update({ status: "lobby", result: null }).eq("code", roomCode);
    });

    // ---------- Points ----------

    // Barème : à ajuster ici après les tests si le jeu paraît déséquilibré
    const POINTS = {
      teamWin: 1,      // partie gagnée : chaque équipier
      voteHit: 1,      // partie perdue, imposteur démasqué : chaque joueur qui a voté pour lui
      impostorWin: 2   // partie perdue, imposteur non démasqué (égalité comprise)
    };

    // Calcule qui gagne combien de points, sans rien écrire dans la base
    function computePoints(result, players, votes) {
      const impostor = players.find((p) => p.is_impostor);

      // Nombre de voix reçues par chaque joueur
      const counts = {};
      for (const v of votes) counts[v.target_id] = (counts[v.target_id] || 0) + 1;

      const gains = {};
      let caught = false;

      if (result === "win") {
        for (const p of players) if (!p.is_impostor) gains[p.id] = POINTS.teamWin;
      } else if (impostor) {
        // Règle : l'imposteur est démasqué seulement s'il a STRICTEMENT plus de voix que chaque autre
        const impostorVotes = counts[impostor.id] || 0;
        const othersMax = Math.max(
          0, ...players.filter((p) => !p.is_impostor).map((p) => counts[p.id] || 0)
        );
        caught = impostorVotes > othersMax;

        if (caught) {
          for (const v of votes) {
            if (v.target_id === impostor.id) gains[v.voter_id] = (gains[v.voter_id] || 0) + POINTS.voteHit;
          }
        } else {
          gains[impostor.id] = POINTS.impostorWin;
        }
      }
      return { impostor, counts, caught, gains };
    }

    // Ajoute les points au score de chaque joueur (appelé une seule fois, par l'hôte)
    async function awardPoints(result) {
      const { data: players } = await db
        .from("players")
        .select("id, score, is_impostor")
        .eq("room_code", roomCode);
      const { data: votes } = await db
        .from("votes")
        .select("voter_id, target_id")
        .eq("room_code", roomCode);
      if (!players || !votes) return;

      const { gains } = computePoints(result, players, votes);
      await Promise.all(
        players
          .filter((p) => gains[p.id])
          .map((p) => db.from("players").update({ score: p.score + gains[p.id] }).eq("id", p.id))
      );
    }

    // ---------- Quitter, fermer, retirer (salle d'attente uniquement) ----------

    // Oublie le salon en local et revient à l'accueil
    function leaveLocally(message) {
      if (channel) { db.removeChannel(channel); channel = null; }
      try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { console.error(e); }
      roomCode = null;
      myId = null;
      myRole = null;
      show("home");
      say(message);
    }

    // Un joueur (non hôte) quitte : on oublie le salon d'abord, puis on le supprime de la base
    $("leave").addEventListener("click", async () => {
      const id = myId;
      leaveLocally("");
      await db.from("players").delete().eq("id", id);
    });

    // L'hôte ferme le salon : la suppression efface aussi les joueurs et les votes,
    // et les autres écrans reviennent à l'accueil en le constatant
    $("closeRoom").addEventListener("click", async () => {
      const code = roomCode;
      leaveLocally("Salon fermé.");
      await db.from("rooms").delete().eq("code", code);
    });

    // L'hôte retire un joueur (par exemple un onglet fermé qui occupe une place)
    async function kickPlayer(id) {
      await db.from("players").delete().eq("id", id);
    }

    // ---------- Retrouver sa place après un rechargement ----------

    // Au chargement de la page : si on avait une place dans un salon, on y retourne
    async function restoreSession() {
      let saved = null;
      try {
        saved = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      } catch (e) { saved = null; }
      if (!saved) return;

      // On vérifie que le joueur existe toujours (le salon existe alors forcément aussi)
      const { data: player } = await db
        .from("players")
        .select("id")
        .eq("id", saved.playerId)
        .eq("room_code", saved.roomCode)
        .maybeSingle();

      if (!player) {
        sessionStorage.removeItem(SESSION_KEY);
        return;
      }
      enterRoom(saved.roomCode, saved.playerId);
    }

    // ---------- Thème clair / sombre ----------

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      // L'icône montre le thème vers lequel on bascule
      $("themeToggle").textContent = (theme === "dark") ? "☀️" : "🌙";
      try { localStorage.setItem("imposteur-lol-theme", theme); } catch (e) { console.error(e); }
    }

    $("themeToggle").addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    // Met l'icône à jour au chargement (sans changer le thème déjà appliqué)
    $("themeToggle").textContent =
      (document.documentElement.getAttribute("data-theme") === "dark") ? "☀️" : "🌙";

    restoreSession();
  </script>
</body>
</html>
